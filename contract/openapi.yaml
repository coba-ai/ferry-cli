            cashLocationId: { type: string, description: "`cash` sides only." }
            category: { type: string, examples: ["crypto", "fiatAccount", "cash"] }
            id: { type: [string, "null"] }
            network: { type: [string, "null"] }
            type: { type: string, examples: ["walletCrypto", "bankUs"] }
        sourceToDestination: { type: string, description: The corridor composite the two sides resolve to. }
        status: { type: string, examples: ["open"] }

    Transaction:
      type: object
      description: |
        The completed transfer, as the `201` of `POST /v1/transfers` renders
        it. An allowlist projection for `Quote`'s reasons and by the same
        rule — the parties, the instrument detail, the operator-facing
        recovery prose and the source transaction hash are not kept.

        **Read `status` and `subStatus`.** `201` is the upstream accepting the
        transfer, not settling it: the lifecycle runs `processing`,
        `awaitingAction`, `completed`, `failed`, and a transfer can still fail
        after acceptance. FERRY does not re-read that snapshot or deliver a
        webhook today, so a later failure is not something this API will tell
        you about.

        **Nothing here is required**, for the reason `Quote` gives: absence is
        preserved, so `error` is absent on a transfer that has not failed
        rather than null.
      additionalProperties: false
      properties:
        createdAt: { type: string, format: date-time }
        customerId: { type: string }
        destination:
          type: object
          additionalProperties: false
          properties:
            asset: { type: string }
            cashLocationId: { type: string, description: "`cash` sides only." }
            category: { type: string, examples: ["crypto", "fiatAccount", "cash"] }
            id: { type: [string, "null"] }
            network: { type: [string, "null"] }
            type: { type: string, examples: ["walletCrypto", "bankUs"] }
        error:
          type: object
          additionalProperties: false
          description: Present once a transfer has failed. The operator prose and the recovery instructions are withheld; `code` is the machine-readable half and the one to branch on.
          properties:
            code: { type: string }
            occurredAt: { type: string, format: date-time }
            recoverable: { type: boolean }
        estimatedArrival: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        id: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: Your own key/values, as sent on the transfer request and echoed by the upstream.
        object: { type: string, const: "transaction" }
        precursor:
          type: object
          additionalProperties: false
          description: What created this transaction — for a transfer executed from a plan, the quote it was priced on.
          properties:
            id: { type: string }
            type: { type: string, examples: ["quote"] }
        pricing:
          type: object
          additionalProperties: false
          properties:
            destination:
              type: object
              additionalProperties: false
              properties:
                amountGross: { type: string }
                amountNet: { type: string }
                asset: { type: string }
                feesDeducted:
                  type: object
                  additionalProperties: false
                  properties:
                    developer: { type: string }
                    gas: { type: string }
                    oms: { type: string }
                    total: { type: string }
            effectiveRate: { type: string }
            exchangeRate: { type: string }
            fixedAmountSide: { type: string, enum: [source, destination], description: Which side the caller fixed the amount on. }
            pair: { type: string, examples: ["usdc/usd"] }
            source:
              type: object
              additionalProperties: false
              properties:
                amountGross: { type: string }
                amountNet: { type: string }
                asset: { type: string }
                feesDeducted:
                  type: object
                  additionalProperties: false
                  properties:
                    developer: { type: string }
                    gas: { type: string }
                    oms: { type: string }
                    total: { type: string }
            sponsorGas: { type: boolean }
            sponsorGasCost: { type: string }
        source:
          type: object
          additionalProperties: false
          properties:
            asset: { type: string }
            cashLocationId: { type: string, description: "`cash` sides only." }
            category: { type: string, examples: ["crypto", "fiatAccount", "cash"] }
            id: { type: [string, "null"] }
            network: { type: [string, "null"] }
            type: { type: string, examples: ["walletCrypto", "bankUs"] }
        sourceToDestination: { type: string, description: The corridor composite the two sides resolve to. }
        status: { type: string, examples: ["processing", "completed", "failed"] }
        subStatus: { type: string, description: The status-scoped sub-state, always present alongside a status. }
        updatedAt: { type: string, format: date-time }

    ExecuteRequest:
      type: object
      description: |
        Execution takes the plan, not the transfer fields. The terms were
        pinned when the plan was issued; re-sending them would invite a
        disagreement between what you asked for and what you were quoted.
      required: [plan_token]
      properties:
        plan_token:
          type: string
          description: |
            From `plan.token` on the simulate response. Single-use, and
            returned only once. Format is `ferry_plan_` followed by 43
            alphanumeric characters.
          examples: ["ferry_plan_grpQ0HNkX8mJ2vB7cD4fG6hK9lN1pQ3rS5tU7wY0zA2"]

    TransferRequest:
      type: object
      description: |
        These six keys are the whole request surface. An unrecognised
        top-level key is **refused**, not ignored — a caller who misspells
        `sponsor_gas` and is answered `201` has been told FERRY honoured
        something it dropped.
      required: [customer_id, source, destination, amount]
      additionalProperties: false
      properties:
        customer_id: { type: string }
        source: { $ref: "#/components/schemas/TransferSide" }
        destination: { $ref: "#/components/schemas/TransferSide" }
        amount:
          type: object
          required: [side, value]
          properties:
            side:
              type: string
              enum: [source, destination]
              description: |
                Which side the value is fixed on. `source` means send exactly
                this much; `destination` means deliver exactly this much.
            value:
              type: string
              description: A decimal string. Never a float — binary floating point cannot represent money exactly.
              examples: ["100.00"]
        sponsor_gas:
          type: boolean
          description: Ask FERRY to sponsor the network gas cost. Sent upstream as `sponsorGas`.
        metadata:
          type: object
          description: Your own key/values. Forwarded to the upstream and returned on the quote.
          additionalProperties: true

    TransferSide:
      type: object
      description: |
        Which fields are required depends on `type`, which selects the arm:

        - `bankUs`, `bankIban`, `bankCanada` require `account_holder`;
          `bankIban` does not take `network`.
        - `walletFiat` and `card` do not take `network`.
        - `walletExternal` requires exactly one of `id` or
          `blockchain_address`.
        - `cash` requires one of `cash_location_id` or
          `cash_location_reference`.

        An unrecognised key on a side is refused, not ignored, the same way an
        unrecognised top-level key is. `required` below lists only what every
        arm shares.
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, examples: ["walletCrypto", "bankUs"] }
        id: { type: string }
        asset: { type: string, examples: ["usdc", "usd"] }
        network: { type: string, examples: ["polygon", "ach"] }
        account_holder: { type: string, examples: ["customer"] }
        blockchain_address: { type: string, description: "`walletExternal` only, as an alternative to `id`." }
        cash_location_id: { type: string, description: "`cash` only." }
        cash_location_reference: { type: string, description: "`cash` only." }

    Corridor:
      type: object
      properties:
        object: { type: string }
        id: { type: string }
        composite: { type: string }
        source: { $ref: "#/components/schemas/CorridorSide" }
        destination: { $ref: "#/components/schemas/CorridorSide" }
        availability_stated:
          type: boolean
          description: |
            Currently `false` on every corridor. A network appearing in the
            vocabulary is not a promise the destination accepts it.
        amount:
          type: object
          description: The amount rules this corridor is quoted under.
          properties:
            side:
              type: string
              enum: [either, destination]
              description: Which `amount.side` values this corridor accepts on a request.
            multiple: { type: [string, "null"], description: Amounts must be a multiple of this, when set. }
            maximum: { type: [string, "null"], description: Per-transfer ceiling, when the corridor states one. }
        quotable:
          type: boolean
          description: Whether FERRY will price this corridor. A published corridor may still be false here.
        reason: { type: [string, "null"], description: Why `quotable` is false. }

    CorridorSide:
      type: object
      properties:
        type: { type: string }
        category: { type: string }
        allowed_assets:
          type: [array, "null"]
          items: { type: string }
          description: |
            `null` and `[]` are different answers and are written through
            unchanged. `null` is "the contract enumerates nothing here"; `[]`
            is "it enumerates an empty set". Do not coerce one to the other.
        allowed_networks:
          type: [array, "null"]
          items: { type: string }
          description: As `allowed_assets` — `null` is not `[]`.
